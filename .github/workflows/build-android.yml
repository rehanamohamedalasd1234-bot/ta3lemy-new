name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.json'
      - '*.css'
      - '*.png'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Android SDK platform
        run: sdkmanager --licenses > /dev/null || true

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Copy web app into Capacitor
        run: npm run cap:copy

      - name: Build signed release APK
        working-directory: android
        run: APP_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER)) ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ta3lemy-hafez-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ta3lemy-hafez.apk
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest ta3lemy-hafez.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit latest --repo "$GITHUB_REPOSITORY" --title "آخر إصدار من تطبيق منصة حافظ" --notes "يتم تحديث هذا الإصدار تلقائيًا من الفرع main."
          else
            gh release create latest ta3lemy-hafez.apk --repo "$GITHUB_REPOSITORY" --title "آخر إصدار من تطبيق منصة حافظ" --notes "يتم تحديث هذا الإصدار تلقائيًا من الفرع main."
          fi
